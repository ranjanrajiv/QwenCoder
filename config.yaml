project:
  name: python-dpo

paths:
  raw_data: data/raw
  problems: data/problems
  candidates: data/candidates
  evaluations: data/evaluations
  rankings: data/rankings
  preferences: data/preferences
  reports: data/reports

logging:
  level: INFO

# Which model to load and how. The identifier lives here and never in source code, so
# swapping models requires no code change. Never put HF_TOKEN or any other credential in
# this file — authentication is read from the environment.
model:
  provider: transformers
  name: "Qwen/Qwen2.5-Coder-3B-Instruct"
  revision: null
  device: auto
  dtype: auto
  trust_remote_code: false
  # Reserved for a later stage (4-bit/8-bit). Must be null for now.
  quantization: null

generation:
  candidates_per_problem: 5
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 512
  do_sample: true
  repetition_penalty: 1.0
  seed: 42
  # Infrastructure failures (model-loading hiccups, transient inference errors) are
  # retried up to this many attempts. Candidate failures (empty output, extraction
  # failure) are never retried, regardless of this setting.
  retry:
    max_attempts: 2

# One candidate per strategy when candidates_per_problem is 5.
generation_strategies:
  - normal
  - straightforward
  - edge_case_focused
  - alternative
  - optimized

# The isolated Docker sandbox used to execute untrusted generated code. These are the
# limits enforced by the container runtime itself, not by application-level checks.
# Never put credentials here — the container receives no host environment at all.
sandbox:
  # Pin the version. A ':latest' tag is rejected: it can change underneath us and would
  # silently change what every recorded execution result means.
  image: "python:3.12-slim"
  # Optional stronger pin. When set, the sandbox runs image@sha256:... instead of the tag.
  image_digest: null
  # Candidate containers must have no network access, so 'none' is the only accepted
  # value. The key exists to make the guarantee explicit rather than implicit.
  network_mode: "none"
  cpus: 1.0
  memory: "512m"
  pids_limit: 64
  # How long the candidate's own program may run.
  timeout_seconds: 5
  # Extra allowance for container creation and interpreter startup, which cost ~2s even on
  # a warm image and are not the candidate's doing. The total wait is the sum of the two;
  # raise this on a slow or heavily loaded machine.
  startup_grace_seconds: 10
  max_output_bytes: 1000000
  read_only_root: true
  run_as_non_root: true
  drop_capabilities: true
  # Numeric UID:GID used when run_as_non_root. 65534 is nobody:nogroup, which already
  # exists in the stock image, so no custom Dockerfile is needed.
  user: "65534:65534"
  # Writable tmpfs mounted at /tmp under the read-only root filesystem.
  tmpfs_size: "64m"
  # Where per-execution job directories are created. null uses the system temp directory.
  workspace_root: null
  # Whether the health check may pull a missing image.
  auto_pull: true

# The candidate test executor (Stage 6). Every isolation setting above — network mode,
# user, capabilities, resource limits — is inherited unchanged from `sandbox:` when
# building the evaluation container; only the image and timeout budget differ here.
evaluation:
  # Built locally via `docker build -t python-dpo-evaluator:1.0 docker/evaluator/`, not
  # pulled from a registry — the container has no network at evaluation time.
  image: "python-dpo-evaluator:1.0"
  # pytest startup and test collection need more headroom than sandbox.timeout_seconds.
  timeout_seconds: 30
  startup_grace_seconds: 10
  # No registry to pull a locally-built image from, unlike sandbox's stock image.
  auto_pull: false
