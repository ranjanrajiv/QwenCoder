# The Stage 12 reference experiment (spec section 8), extended with the hypothesis and
# success-criteria block spec section 58 asks every experiment to carry.
#
# All nine stages are implemented and enabled. `error_analysis` (Stage 11) is pure
# computation over the artifacts the earlier stages persisted -- no model, no GPU, no
# Docker -- and emits next_experiment.yaml without retraining anything.
#
# Every value below is overridable per-invocation with `--set stage.key=value`, and the
# whole file is overridable with `--config`; this file is the shipped default, not the
# only experiment.

experiment:
  name: qwen-python-dpo-v1
  seed: 42

git:
  # Fail rather than warn: an experiment result attributed to a dirty tree cannot be
  # reproduced from the recorded git commit alone (spec section 29).
  on_dirty: fail

hypothesis:
  description: >
    DPO fine-tuning on the curated Python problem preference dataset improves held-out
    pass@1 over the base Qwen2.5-Coder-3B-Instruct model without a corresponding
    regression on problems the base model already solves.

success_criteria:
  pass_at_1_delta: 0.02

problem_dataset:
  enabled: true
  # No problem_count: the full curated catalog (spec section 52's finding -- Stage 2 is
  # ten hand-authored problems, not an LLM generator, so there is no larger pool to draw
  # a subset from by default).

candidate_generation:
  enabled: true
  candidates_per_problem: 5

candidate_execution:
  enabled: true

candidate_evaluation:
  enabled: true

preference_generation:
  enabled: true
  policy: strict

dpo_training:
  enabled: true
  config: configs/training/dpo_qlora.yaml

model_evaluation:
  enabled: true
  benchmark: python_eval_v1
  num_samples: 10

error_analysis:
  enabled: true

packaging:
  enabled: true
