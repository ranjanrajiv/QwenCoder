candidate_evaluation:
  enabled: true
candidate_execution:
  enabled: true
candidate_generation:
  candidates_per_problem: 5
  enabled: true
dpo_training:
  allow_small_dataset: true
  config: configs/training/dpo_qlora.yaml
  enabled: true
error_analysis:
  enabled: false
experiment:
  name: qwen-python-dpo-v1
  seed: 42
git:
  on_dirty: fail
hypothesis:
  description: 'DPO fine-tuning on the curated Python problem preference dataset improves
    held-out pass@1 over the base Qwen2.5-Coder-3B-Instruct model without a corresponding
    regression on problems the base model already solves.

    '
model_evaluation:
  benchmark: python_eval_v1
  enabled: true
  num_samples: 10
packaging:
  enabled: true
preference_generation:
  enabled: true
  policy: strict
problem_dataset:
  enabled: true
success_criteria:
  pass_at_1_delta: 0.02
