candidate_evaluation:
  enabled: true
candidate_execution:
  enabled: true
candidate_generation:
  candidates_per_problem: 5
  enabled: true
  problem_ids:
  - p002
  - p004
dpo_training:
  allow_small_dataset: true
  config: configs/training/dpo_qlora.yaml
  enabled: true
  max_steps: 1
error_analysis:
  enabled: false
experiment:
  name: qwen-python-dpo-smoke
  seed: 42
