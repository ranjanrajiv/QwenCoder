[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-dpo"
dynamic = ["version"]
description = "Preference-data generation pipeline for DPO fine-tuning of a Qwen Coder model on Python tasks."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Inference backend, deliberately optional: the core install and the whole test suite
# run offline without it. Only `python -m python_dpo generate` against a real model
# needs these.
model = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.30",
]

[project.scripts]
python-dpo = "python_dpo.cli:main"

[tool.setuptools.dynamic]
version = {attr = "python_dpo.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
