[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-dpo"
dynamic = ["version"]
description = "Preference-data generation pipeline for DPO fine-tuning of a Qwen Coder model on Python tasks."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Inference backend, deliberately optional: the core install and the whole test suite
# run offline without it. Only `python -m python_dpo generate` against a real model
# needs these.
model = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.30",
]
# DPO/QLoRA training (Stage 9), deliberately optional for the same reason as `model`:
# the core install and the whole default test suite run without it. Floors are set at the
# versions this stage was actually built and verified against, not the lowest plausible --
# TRL 1.x changed the DPOTrainer/DPOConfig surface materially from 0.x, so a lower floor
# would resolve to an API this code does not speak.
training = [
    "torch>=2.2",
    "transformers>=4.56",
    "accelerate>=0.30",
    "trl>=1.10",
    "peft>=0.20",
    "bitsandbytes>=0.50",
    "datasets>=5.0",
]

[project.scripts]
python-dpo = "python_dpo.cli:main"

[tool.setuptools.dynamic]
version = {attr = "python_dpo.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Integration tests need a running Docker daemon, so they are deselected by default:
# `pytest -q` stays offline, dependency-free, and reports zero skips on any machine.
# Run the sandbox suite explicitly with `pytest -q -m integration` (a -m on the command
# line overrides the one here), or everything with `pytest -q -m ""`.
addopts = "-ra -m 'not integration and not gpu'"
markers = [
    "integration: requires a running Docker daemon",
    "gpu: requires a CUDA GPU and the training extra (pip install -e '.[training]')",
]
